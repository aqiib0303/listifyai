<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ListifyAI — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808;
      color: #f0f0f0;
      font-family: 'Space Mono', monospace, 'Courier New', Courier;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { width: 100%; max-width: 420px; padding: 24px; }
    .logo-box {
      width: 48px; height: 48px;
      background: #e8ff47;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      margin: 0 auto 16px;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 28px;
    }
    .field-label {
      display: block;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .input-field {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-family: 'Space Mono', monospace, 'Courier New';
      font-size: 13px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #e8ff47; }
    .form-row { margin-bottom: 16px; }
    .btn-primary {
      width: 100%;
      padding: 13px 24px;
      background: #e8ff47;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #d4eb30; }
    .error-box {
      background: #200a0a;
      border: 1px solid #ff6b6b;
      border-radius: 8px;
      padding: 12px 16px;
      color: #ff6b6b;
      font-size: 12px;
      margin-bottom: 16px;
    }
    a { color: #e8ff47; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="wrap">
  <div style="text-align:center;margin-bottom:36px;">
    <div class="logo-box">✦</div>
    <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:#f0f0f0;letter-spacing:-0.5px;">
      LISTIFY<span style="color:#e8ff47">AI</span>
    </div>
    <div style="font-size:11px;color:#444;letter-spacing:2px;margin-top:4px;">SIGN IN TO YOUR ACCOUNT</div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="error-box">✕ {{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <div class="card">
    <form method="POST" action="{{ url_for('auth.login_page') }}">
      <div class="form-row">
        <label class="field-label">Email</label>
        <input type="email" name="email" class="input-field" placeholder="you@example.com" required autofocus>
      </div>
      <div class="form-row">
        <label class="field-label">Password</label>
        <input type="password" name="password" class="input-field" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">✦ Sign In</button>
    </form>
  </div>

  <div style="text-align:center;margin-top:20px;font-size:12px;color:#555;">
    No account? <a href="{{ url_for('auth.register_page') }}">Create one →</a>
  </div>
</div>
</body>
</html>
